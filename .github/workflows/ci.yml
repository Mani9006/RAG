name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        # Simulation backend: the whole suite runs offline with zero API spend.
        run: python -m pytest --cov=sentinel --cov-report=term-missing
      - name: Dataset is reproducible
        run: |
          python scripts/generate_data.py
          git diff --exit-code data/

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: End-to-end pipeline smoke test (offline)
        run: |
          sentinel reset
          sentinel run
          sentinel incidents
          sentinel approvals
